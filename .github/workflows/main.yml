name: Build TRYxDEVIL Mod

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project ZIP
        run: |
          unzip -o TRYxDEVIL-Mod-1.21.10-Fabric-buildable.zip -d project
          find project -name gradlew -exec chmod +x {} \;

      - name: Build mod
        run: |
          cd project
          GRADLEW=$(find . -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No Gradle wrapper found in ZIP"
            exit 1
          fi
          cd "$(dirname "$GRADLEW")"
          ./gradlew build

      - name: Upload JAR files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TRYxDEVIL-Mod-JAR
          path: project/**/*.jar
          
